name: stream4videos
description: "This is a ott platform"

publish_to: 'none'


version: 1.0.0+1

environment:
  sdk: ^3.9.2


dependencies:
  flutter:
    sdk: flutter

  # Network + API
  dio: ^5.9.0

  # State Management
  flutter_riverpod: ^3.0.3
  hooks_riverpod: ^3.0.3
  flutter_hooks: ^0.21.3+1

  # utils
  intl: ^0.20.2
  flutter_screenutil: ^5.9.3
  shared_preferences: ^2.5.3
  go_router: ^17.0.0
  pinput: ^6.0.1
  image_picker: ^1.2.1
  firebase_core: ^4.1.1
  cloud_firestore: ^6.0.2
  firebase_messaging: ^16.0.2
  flutter_local_notifications: ^19.4.2
  share_plus:
  app_links:





  #permission
  permission_handler: ^12.0.1
  smooth_page_indicator:
  flutter_localizations:
    sdk: flutter
  #  video_player: ^2.10.1
  carousel_slider: ^5.1.1
  motion_toast:  ^2.15.0
  #  screen_brightness: ^2.1.7
  #  volume_controller: ^3.4.1
  #  wakelock_plus: ^1.4.0
  better_player_plus: ^1.1.5
  device_info_plus: ^12.3.0
  internet_connection_checker:
  cached_network_image: ^3.4.1
  flutter_widget_from_html: ^0.17.1

  #  payment CashFree
  flutter_cashfree_pg_sdk: ^2.2.9+47
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^5.0.0


flutter:

  generate: true
  uses-material-design: true




  fonts:
    - family: Poppins
      fonts:
        - asset: assets/font/poppins_regular.ttf



  assets:
    - assets/
    - assets/font/
    - assets/icon/
    - assets/image/
    - assets/videos/



